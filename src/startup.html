<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0e1116;
      color: #e6edf3;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2d333b;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status { color: #9aa4b2; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="status">正在启动 DeepSeek Harness 服务…</div>
</body>
</html>
